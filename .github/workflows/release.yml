name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release'
        required: false
        default: 'v2.13.0_1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows
        run: cargo build --release --bin ag_unlocker
      - name: Prepare Windows artifact
        run: |
          mkdir -p dist
          cp target/release/ag_unlocker.exe dist/Antigravity-Unlocker-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Antigravity-Unlocker-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux
        run: cargo build --release --bin ag_unlocker
      - name: Prepare Linux bundle
        run: |
          mkdir -p bundle
          cp target/release/ag_unlocker bundle/
          cp linux/* bundle/ || true
          tar -czvf Antigravity-Unlocker-Linux.tar.gz -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Antigravity-Unlocker-Linux.tar.gz

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag || 'v2.13.0_1' }}"
          fi
          gh release create "$TAG" \
            artifacts/windows/Antigravity-Unlocker-Windows.exe \
            artifacts/linux/Antigravity-Unlocker-Linux.tar.gz \
            --title "Antigravity Unlocker $TAG" \
            --notes "Antigravity Unlocker: без лицензионного кода, с поддержкой Antigravity VS Code."
