name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release'
        required: false
        default: 'v2.15.1.3'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag || 'v2.15.1.3' }}"
          fi
          VER="${TAG#v}"
          AG_FULL_VERSION="$VER" cargo build --release --bin ag_unlocker
      - name: Prepare Windows artifact
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag || 'v2.15.1.3' }}"
          fi
          VER="${TAG#v}"
          mkdir -p dist
          cp target/release/ag_unlocker.exe dist/Antigravity-Unlocker-Windows.exe
          cp target/release/ag_unlocker.exe "dist/AG_${VER}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag || 'v2.15.1.3' }}"
          fi
          VER="${TAG#v}"
          AG_FULL_VERSION="$VER" cargo build --release --bin ag_unlocker
      - name: Prepare Linux bundle
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag || 'v2.15.1.3' }}"
          fi
          VER="${TAG#v}"
          mkdir -p bundle
          cp target/release/ag_unlocker bundle/
          cp linux/* bundle/ || true
          mkdir -p dist
          tar -czvf dist/Antigravity-Unlocker-Linux.tar.gz -C bundle .
          mkdir -p "AG_${VER}_linux"
          cp bundle/* "AG_${VER}_linux/" || true
          tar -czvf "dist/AG_${VER}_linux.tar.gz" "AG_${VER}_linux"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag || 'v2.15.1.3' }}"
          fi
          gh release delete "$TAG" -y --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" \
            artifacts/windows/* \
            artifacts/linux/* \
            --title "Antigravity Unlocker $TAG" \
            --notes "Antigravity Unlocker $TAG: без лицензионного кода, с поддержкой Antigravity VS Code и TUI."

